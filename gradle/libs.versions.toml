[versions]
agp = "8.13.2"
kotlin = "2.3.21"
composeBom = "2025.08.01"
activity = "1.10.1"
coroutines = "1.8.1"
commonmark = "0.30.0"
onnxruntime = "1.31.0"
opencv = "4.13.0"
camerax = "1.6.2"
guava = "33.7.2-android"
junit = "4.13.2"
androidxJunit = "1.2.1"
testRunner = "1.6.2"
espresso = "3.6.1"
robolectric = "4.16"
jacoco = "0.8.15"
detekt = "1.23.8"
ktlint = "1.7.1"
licenseReport = "3.1.1"

[libraries]
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
guava-android = { module = "com.google.guava:guava", version.ref = "guava" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
opencv = { module = "org.opencv:opencv", version.ref = "opencv" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "testRunner" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
license-report = { id = "com.github.jk1.dependency-license-report", version.ref = "licenseReport" }
