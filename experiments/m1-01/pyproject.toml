[project]
name = "blamera-m1-01-exploration"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "ultralytics==8.4.190",
    "torch==2.14.1+cpu",
    "torchvision==0.29.1+cpu",
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
